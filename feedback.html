<!DOCTYPE html>
<html>
<head>
  <title>Feedback</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
  <img src="https://i.ibb.co/qYZYL4d7/Chat-GPT-Image-May-4-2026-12-39-24-AM.png" class="logo">
  <nav>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="services.html">Services</a>
    <a href="gallery.html">Gallery</a>
    <a href="contact.html">Contact</a>
    <a href="feedback.html">Feedback</a>
  </nav>

</header>

<main class="content">

  <section class="form-section">

    <h1>Customer Feedback</h1>

    <p>
      We value your opinion. Please rate our services and leave feedback below.
    </p>

   <form id="feedback-form">

  <input type="hidden"
         name="_subject"
         value="New Customer Feedback">

  <input type="text"
         id="name"
         name="name"
         placeholder="Your Name"
         required>

  <input type="email"
         id="email"
         name="email"
         placeholder="Your Email"
         required>

  <select name="rating" required>
    <option value="">Rate Us</option>
    <option value="Excellent">Excellent</option>
    <option value="Good">Good</option>
    <option value="Average">Average</option>
    <option value="Poor">Poor</option>
  </select>

  <textarea id="message"
            name="message"
            placeholder="Write your feedback..."
            required></textarea>

  <button type="submit">
    Submit Feedback
  </button>

</form>

<p id="status"></p>

  </section>

</main>

<footer>

  <section class="footer-container">

    <article>
      <h3>Growth Point Printers</h3>
      <p>Quality printing services</p>
    </article>

    <article class="footer-links">

      <h3>Quick Links</h3>

      <a href="index.html">Home</a>
      <a href="services.html">Services</a>
      <a href="gallery.html">Gallery</a>
      <a href="feedback.html">Feedback</a>

    </article>

    <article class="socials">

      <h3>Follow Us</h3>

      <img src="https://cdn-icons-png.flaticon.com/24/733/733547.png" alt="">
      <img src="https://cdn-icons-png.flaticon.com/24/733/733558.png" alt="">
      <img src="https://cdn-icons-png.flaticon.com/24/733/733585.png" alt="">

    </article>

  </section>

  <p class="copyright">
    © 2026 Growth Point Printers. All rights reserved.
  </p>

</footer>

<script>

const form = document.getElementById("feedback-form");
const status = document.getElementById("status");

form.addEventListener("submit", async function(e) {

  e.preventDefault();

  let name = document.getElementById("name").value;

  if(name.length < 3) {

    alert("Name must be at least 3 characters.");

    return;
  }

  const data = new FormData(form);

  const response = await fetch(
    "https://formspree.io/f/mgoqneyq",
    {
      method: "POST",
      body: data,
      headers: {
        'Accept': 'application/json'
      }
    }
  );

  if(response.ok){

    status.innerHTML = "Message Sent Successfully!";
    status.style.color = "green";

    form.reset();

  } else {

    status.innerHTML = "Failed to send message.";
    status.style.color = "red";
  }

});

</script>

</body>
</html>
