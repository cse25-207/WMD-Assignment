<!DOCTYPE html>
<html>
<head>
  <title>Contact</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
  <img src="https://i.ibb.co/qYZYL4d7/Chat-GPT-Image-May-4-2026-12-39-24-AM.png" class="logo">
  <nav>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="services.html">Services</a>
    <a href="gallery.html">Gallery</a>
    <a href="contact.html">Contact</a>
    <a href="feedback.html">Feedbak</a>
  </nav>

</header>

<main class="content">

  <section class="form-section">

    <h1>Contact Us</h1>

    <p>
      Have questions or want to work with us?
      Send us a message below.
    </p>
<form id="contact-form">

  <input type="hidden"
         name="_subject"
         value="New Contact Message">

  <input type="text"
         id="name"
         name="name"
         placeholder="Your Name"
         required>

  <input type="email"
         id="email"
         name="email"
         placeholder="Your Email"
         required>

  <textarea id="message"
            name="message"
            placeholder="Your Message"
            required></textarea>

  <button type="submit">
    Send Message
  </button>

</form>

<p id="status"></p>
  </section>

</main>

<footer>

  <section class="footer-container">

    <article>
      <h3>Growth Point Printers</h3>
      <p>Quality printing services</p>
    </article>

    <article class="footer-links">

      <h3>Quick Links</h3>

      <a href="index.html">Home</a>
      <a href="services.html">Services</a>
      <a href="gallery.html">Gallery</a>
      <a href="feedback.html">Feedback</a>

    </article>

    <article class="socials">

      <h3>Follow Us</h3>

      <img src="https://cdn-icons-png.flaticon.com/24/733/733547.png" alt="">
      <img src="https://cdn-icons-png.flaticon.com/24/733/733558.png" alt="">
      <img src="https://cdn-icons-png.flaticon.com/24/733/733585.png" alt="">

    </article>

  </section>

  <p class="copyright">
    © 2026 Growth Point Printers. All rights reserved.
  </p>

</footer>

<script>

const form = document.getElementById("contact-form");
const status = document.getElementById("status");

form.addEventListener("submit", async function(e) {

  e.preventDefault();

  let name = document.getElementById("name").value;

  if(name.length < 3) {

    alert("Name must be at least 3 characters.");

    return;
  }

  const data = new FormData(form);

  const response = await fetch(
    "https://formspree.io/f/xbdbzjjg",
    {
      method: "POST",
      body: data,
      headers: {
        'Accept': 'application/json'
      }
    }
  );

  if(response.ok){

    status.innerHTML = "Message Sent Successfully!";
    status.style.color = "green";

    form.reset();

  } else {

    status.innerHTML = "Failed to send message.";
    status.style.color = "red";
  }

});

</script>

</body>
</html>
